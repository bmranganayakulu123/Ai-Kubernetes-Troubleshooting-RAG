apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-api
  namespace: rag-production
spec:
  replicas: 2

  selector:
    matchLabels:
      app: rag-api

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  template:
    metadata:
      labels:
        app: rag-api

    spec:
      serviceAccountName: rag-api

      containers:
        - name: rag-api
          image: 800380166677.dkr.ecr.ap-northeast-2.amazonaws.com/ai-kubernetes-troubleshooting-rag:v1.0.0

          ports:
            - name: http
              containerPort: 8000

          envFrom:
            - configMapRef:
                name: rag-config

            - secretRef:
                name: rag-secrets

          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"

          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20