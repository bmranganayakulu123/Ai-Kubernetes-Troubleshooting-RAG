apiVersion: batch/v1
kind: Job
metadata:
  name: rag-db-init
  namespace: rag-production
spec:
  backoffLimit: 3

  template:
    metadata:
      labels:
        app: rag-db-init

    spec:
      restartPolicy: Never

      containers:
        - name: postgres-client
          image: postgres:16

          envFrom:
            - secretRef:
                name: db-init-secret

          command:
            - /bin/bash
            - -c
            - |
              set -e

              export PGPASSWORD="${DB_PASSWORD}"

              echo "Testing PostgreSQL connection..."

              psql \
                --host="${DB_HOST}" \
                --port="${DB_PORT}" \
                --username="${DB_USER}" \
                --dbname="vectordb" \
                --set=sslmode=require \
                --command="SELECT version();"

              echo "Enabling pgvector extension..."

              psql \
                --host="${DB_HOST}" \
                --port="${DB_PORT}" \
                --username="${DB_USER}" \
                --dbname="vectordb" \
                --set=sslmode=require \
                --command="CREATE EXTENSION IF NOT EXISTS vector;"

              echo "Checking whether statedb exists..."

              DB_EXISTS=$(psql \
                --host="${DB_HOST}" \
                --port="${DB_PORT}" \
                --username="${DB_USER}" \
                --dbname="vectordb" \
                --set=sslmode=require \
                --tuples-only \
                --no-align \
                --command="SELECT 1 FROM pg_database WHERE datname='statedb';")

              if [ "${DB_EXISTS}" != "1" ]; then
                echo "Creating statedb..."

                psql \
                  --host="${DB_HOST}" \
                  --port="${DB_PORT}" \
                  --username="${DB_USER}" \
                  --dbname="vectordb" \
                  --set=sslmode=require \
                  --command="CREATE DATABASE statedb;"
              else
                echo "statedb already exists."
              fi

              echo "Database initialization completed successfully."